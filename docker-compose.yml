# One command to run everything:   docker compose up --build
# Then open http://localhost:8502
services:
  app:
    build: .
    image: docmind-rag
    ports:
          - "8502:8501"
    env_file:
      - path: .env          # optional: API keys, LLM_PROVIDER, etc.
        required: false
    environment:
      # reach Ollama running on your laptop (not inside the container)
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # needed on Linux; harmless on Windows/Mac
    volumes:
      - ./storage:/app/storage                  # keeps your indexed documents
      - ./data/uploads:/app/data/uploads        # keeps uploaded files
      - hf-cache:/root/.cache/huggingface       # keeps the downloaded embedding model
    restart: unless-stopped

  # Optional REST API:  docker compose --profile api up --build
  api:
    build: .
    image: docmind-rag
    profiles: ["api"]
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./storage:/app/storage
      - ./data/uploads:/app/data/uploads
      - hf-cache:/root/.cache/huggingface

volumes:
  hf-cache:
